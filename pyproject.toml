[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "agua-para-todos"
version = "1.0.0"
description = "Observatório acadêmico do abastecimento de água em Pernambuco"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "statsmodels>=0.14.4,<0.16", "openpyxl>=3.1,<4", "matplotlib>=3.8,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
